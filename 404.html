<!doctype html>
<html lang="en">
<head id="head_tag">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <script>
    // GitHub Pages serves this file for any missing URL, including nested ones such as /club-orbit/a/b,
    // so relative asset links need a base. REPO must match your repository name (project sites only).
    (function () {
      var REPO = 'club-orbit';
      var p = location.pathname;
      var base = (location.hostname.slice(-10) === '.github.io' && p.indexOf('/' + REPO + '/') === 0) ? '/' + REPO + '/' : '/';
      document.write('<base href="' + base + '">');
      // Short links: <site>/s/<slug> ends up here (see link-short.html). Hide the 404 text until we know.
      var rest = p.slice(base.length);
      if (/^s\/[A-Za-z0-9_-]{3,40}\/?$/.test(rest)) {
        document.documentElement.className += ' go';
        window.REMS_SHORT_SLUG = rest.split('/')[1];
      }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="600x600" href="assets/img/Logo_White.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B4444">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&display=swap">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="assets/js/dark-mode.js"></script>
  <style>html.go #notfound{display:none}#go-box{display:none}html.go #go-box{display:block}</style>
  <title>404: Page Not Found</title>
</head>
<body id="page-top">
  <div id="wrapper">
    <div class="container-fluid">
      <div class="text-center mt-5" id="go-box">
        <p class="text-dark lead" id="go-text">Taking you there&hellip;</p>
        <p class="small text-black-50" id="go-sub"></p>
      </div>
      <div class="text-center mt-5" id="notfound">
        <div class="error mx-auto" data-text="404"><p class="m-0">404</p></div>
        <p class="text-dark mb-5 lead">Page Not Found</p>
        <p class="text-black-50 mb-0">It looks like you found a glitch in the matrix...</p>
        <a href="index.html">&larr; Back to Home</a>
      </div>
    </div>
  </div>
  <footer class="sticky-footer">
    <div class="container my-auto"><div class="text-center small">
      <strong>ClubOrbit</strong> by IIST-OSS
    </div></div>
  </footer>
  <script src="js/config.js"></script>
  <script>
    // Resolve a short link. Only http(s) targets are followed.
    (function () {
      var slug = window.REMS_SHORT_SLUG, cfg = window.REMS_CONFIG;
      if (!slug || !cfg || !cfg.SUPABASE_URL) { document.documentElement.className = document.documentElement.className.replace(' go', ''); return; }
      function fail(msg) {
        document.getElementById('go-text').textContent = msg;
        document.getElementById('go-sub').innerHTML = '<a href="index.html">&larr; Back to Home</a>';
      }
      fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/resolve_short_link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: cfg.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + cfg.SUPABASE_ANON_KEY },
        body: JSON.stringify({ s: slug })
      }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
        .then(function (target) {
          var u; try { u = new URL(target); } catch (e) { u = null; }
          if (u && (u.protocol === 'https:' || u.protocol === 'http:')) { document.getElementById('go-sub').textContent = u.hostname; location.replace(u.href); }
          else fail('This short link does not exist or was removed.');
        })
        .catch(function () { fail('Could not open this short link. Please try again in a moment.'); });
    })();
  </script>
</body>
</html>
