<!doctype html>
<html lang="en">
<head id="head_tag">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <link rel="icon" type="image/png" sizes="600x600" href="assets/img/Logo_White.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B4444">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
  <link rel="stylesheet" href="assets/fonts/fontawesome5-overrides.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="assets/js/dark-mode.js"></script>
  <title>Student Portal</title>
</head>
<body id="page-top" style="visibility:hidden">
  <div id="wrapper">
    <div id="rems-sidebar"></div>
    <div class="d-flex flex-column" id="content-wrapper">
      <div id="content">
        <div id="rems-topbar"></div>
        <div class="container-fluid">
          <div class="d-sm-flex justify-content-between align-items-center mb-4">
            <h3 class="text-dark mb-0">Student portal</h3>
          </div>
          <div id="msg"></div>
          <div class="row">
            <div class="col-lg-6 mb-4">
              <div class="card shadow h-100">
                <div class="card-header py-3"><h6 class="text-primary m-0 font-weight-bold">My record</h6></div>
                <div class="card-body" id="record"><span class="text-muted">Loading...</span></div>
              </div>
            </div>
            <div class="col-lg-6 mb-4">
              <div class="card shadow h-100">
                <div class="card-header py-3"><h6 class="text-primary m-0 font-weight-bold">Getting started</h6></div>
                <div class="card-body">
                  <ul class="list-unstyled mb-0" id="checklist"></ul>
                  <a class="btn btn-primary btn-sm mt-3" href="profile.html"><i class="fas fa-user mr-1"></i>Edit my profile</a>
                  <button class="btn btn-success btn-sm mt-3 ml-1" type="button" id="complete-btn" style="display:none"><i class="fas fa-check mr-1"></i>My profile is complete</button>
                </div>
              </div>
            </div>
          </div>
          <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="text-primary m-0 font-weight-bold">My clubs and positions</h6></div>
            <div class="card-body"><div id="my-clubs"></div></div>
          </div>
          <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="text-primary m-0 font-weight-bold">Club directory</h6></div>
            <div class="card-body"><div class="table-responsive">
              <table class="table my-0"><thead><tr><th>Club</th><th>About</th><th>Faculty advisor</th><th></th></tr></thead>
              <tbody id="directory-body"><tr><td colspan="4" class="text-muted">Loading...</td></tr></tbody></table>
            </div></div>
          </div>
          <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="text-primary m-0 font-weight-bold">My certificates</h6></div>
            <div class="card-body"><div class="table-responsive">
              <table class="table my-0"><thead><tr><th>Event</th><th>Club</th><th>Role</th><th>Date</th><th></th></tr></thead>
              <tbody id="certs-body"><tr><td colspan="5" class="text-muted">Loading...</td></tr></tbody></table>
            </div></div>
          </div>
        </div>
      </div>
      <div id="rems-footer"></div>
    </div>
  </div>
  <a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="js/pages/student.js"></script>
</body>
</html>
