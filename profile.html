<!doctype html>
<html lang="en">
<head id="head_tag">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <link rel="icon" type="image/png" sizes="600x600" href="assets/img/Logo_White.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B4444">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
  <link rel="stylesheet" href="assets/fonts/fontawesome5-overrides.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="assets/js/dark-mode.js"></script>
  <title>My profile</title>
</head>
<body id="page-top" style="visibility:hidden">
  <div id="wrapper">
    <div id="rems-sidebar"></div>
    <div class="d-flex flex-column" id="content-wrapper">
      <div id="content">
        <div id="rems-topbar"></div>
        <div class="container-fluid">
          <div class="d-sm-flex justify-content-between align-items-center mb-4">
            <div>
            <h3 class="text-dark mb-0">My profile</h3>
            <p class="text-muted mb-0 page-hint">Your name, contact details and picture.</p>
          </div>
          </div>
          <div id="msg"></div>
          <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="text-primary m-0 font-weight-bold">Edit Profile</h6></div>
            <div class="card-body">
              <form id="profile-form" novalidate>
                <div class="form-row">
                  <div class="col-md-4 text-center mb-3">
                    <img id="pic-preview" src="assets/img/avatars/image2.png" width="200" height="200" class="img-fluid img-thumbnail mb-2" alt="Profile picture" style="object-fit:cover">
                    <div class="custom-file text-left">
                      <input type="file" class="custom-file-input" id="picture" accept="image/png,image/jpeg,image/webp,image/gif">
                      <label class="custom-file-label" for="picture" id="picture-label">Choose picture</label>
                    </div>
                    <small class="form-text text-muted">Resized to 256&times;256 in your browser before saving.</small>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="pic-remove" style="display:none">Remove picture</button>
                  </div>
                  <div class="col-md-8">
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="login_name">Username</label>
                        <input id="login_name" class="form-control" readonly>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="email">Email</label>
                        <input id="email" class="form-control" readonly>
                      </div>
                    </div>
                    <small class="form-text text-muted mb-3" style="margin-top:-8px">Username and email can only be changed by an admin.</small>
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="first_name">First Name</label>
                        <input id="first_name" class="form-control" maxlength="40" required>
                        <div class="invalid-feedback">First name is required.</div>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="last_name">Last Name</label>
                        <input id="last_name" class="form-control" maxlength="40" required>
                        <div class="invalid-feedback">Last name is required.</div>
                      </div>
                    </div>
                    <div class="form-group">
                      <label for="address">Address</label>
                      <input id="address" class="form-control" maxlength="255">
                    </div>
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="phno">Phone</label>
                        <input id="phno" class="form-control" maxlength="40" inputmode="tel">
                        <div class="invalid-feedback">Use digits, spaces, + ( ) and - only.</div>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="signature">Signature</label>
                        <input id="signature" class="form-control" maxlength="255">
                      </div>
                    </div>
                  </div>
                </div>
                <div class="text-right mt-3">
                  <button class="btn btn-primary" type="submit" id="save-btn">Update Profile</button>
                </div>
              </form>
            </div>
          </div>
          <div class="text-center mb-4"><a class="small" href="change-password.html">Change my password</a></div>
        </div>
      </div>
      <div id="rems-footer"></div>
    </div>
  </div>
  <a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
