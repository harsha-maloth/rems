<!doctype html>
<html lang="en">
<head id="head_tag">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <link rel="icon" type="image/png" sizes="600x600" href="assets/img/Logo_White.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B4444">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
  <link rel="stylesheet" href="assets/fonts/fontawesome5-overrides.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="assets/js/dark-mode.js"></script>
  <title>Change Password</title>
</head>
<body class="bg-gradient-primary">
  <div class="container mt-4">
    <div id="state-wait"><h3 class="text-white">Checking your reset link&hellip;</h3></div>
    <div id="state-expired" style="display:none">
      <h3 class="text-white">Password link expired</h3>
      <p class="text-white">Please <a class="text-white" href="forgot-password.html"><u>request a new password reset link</u></a>.</p>
    </div>
    <div id="state-form" style="display:none">
      <h3 class="text-white">Create your new password</h3>
      <div id="msg"></div>
      <form class="user" id="change-form">
        <div class="form-group"><input class="form-control" type="password" name="pwd" placeholder="Enter New Password" autocomplete="new-password" minlength="6" required></div>
        <div class="form-group"><input class="form-control" type="password" name="pwd_confirm" placeholder="Confirm Password" autocomplete="new-password" minlength="6" required></div>
        <button class="btn btn-primary" type="submit" id="change-btn">Reset Password</button>
      </form>
    </div>
    <div id="state-done" style="display:none">
      <div class="alert alert-success">Password updated successfully.</div>
      <a class="btn btn-light" href="login.html">Back to login</a>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="js/pages/change-password.js"></script>
</body>
</html>
