<!doctype html>
<html lang="en">
<head id="head_tag">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <link rel="icon" type="image/png" sizes="600x600" href="assets/img/Logo_White.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B4444">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
  <link rel="stylesheet" href="assets/fonts/fontawesome5-overrides.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <link rel="stylesheet" href="assets/css/orbit-ui.css">
  <script src="assets/js/dark-mode.js"></script>
  <title>Dashboard</title>
</head>
<body id="page-top" style="visibility:hidden">
  <div id="wrapper">
    <div id="rems-sidebar"></div>
    <div class="d-flex flex-column" id="content-wrapper">
      <div id="content">
        <div id="rems-topbar"></div>
        <div class="container-fluid">
          <div class="orbit-page-header">
            <div>
              <h3 class="text-dark mb-0 orbit-page-title" id="welcome-title">Welcome!</h3>
              <p class="text-muted mb-0 page-hint">Your club at a glance.</p>
            </div>
          </div>
          <div id="msg"></div>
          <div class="row">
            <div class="col-md-6 col-xl-4 mb-4">
              <div class="card shadow border-left-primary py-2 h-100"><div class="card-body"><div class="row align-items-center no-gutters">
                <div class="col mr-2">
                  <div class="text-uppercase text-primary font-weight-bold text-xs mb-1"><span>Sign-ups for the latest event</span></div>
                  <div class="text-dark font-weight-bold h5 mb-0"><span id="stat-registrations">0</span></div>
                  <div class="small text-muted text-truncate" id="latest-event-line">&nbsp;</div>
                </div>
                <div class="col-auto"><i class="fas fa-user-friends fa-2x text-gray-300"></i></div>
              </div></div></div>
            </div>
            <div class="col-md-6 col-xl-4 mb-4">
              <div class="card shadow border-left-success py-2 h-100"><div class="card-body"><div class="row align-items-center no-gutters">
                <div class="col mr-2">
                  <div class="text-uppercase text-success font-weight-bold text-xs mb-1"><span>Club members</span></div>
                  <div class="text-dark font-weight-bold h5 mb-0"><span id="stat-members">0</span></div>
                </div>
                <div class="col-auto"><i class="fas fa-user-ninja fa-2x text-gray-300"></i></div>
              </div></div></div>
            </div>
            <div class="col-md-6 col-xl-4 mb-4">
              <div class="card shadow border-left-primary py-2 h-100"><div class="card-body"><div class="row align-items-center no-gutters">
                <div class="col mr-2">
                  <div class="text-uppercase text-primary font-weight-bold text-xs mb-1"><span>Events held</span></div>
                  <div class="text-dark font-weight-bold h5 mb-0"><span id="stat-events">0</span></div>
                </div>
                <div class="col-auto"><i class="fas fa-calendar-day fa-2x text-gray-300"></i></div>
              </div></div></div>
            </div>
          </div>

          <div id="next-wrap" hidden>
            <h5 class="orbit-section-title">What would you like to do?</h5>
            <div class="row" id="next-steps"></div>
          </div>

          <div class="card shadow mb-4">
            <div class="card-body py-3">
              <form id="alert-form" class="orbit-announce">
                <label class="font-weight-bold mb-1" for="alert-message">Post an announcement</label>
                <p class="small text-muted mb-2">It shows in the bell menu of everyone in this club, with your username.</p>
                <div class="input-group">
                  <div class="input-group-prepend" id="alert-type-group" style="display:none">
                    <select class="custom-select" name="type" id="alert-type" aria-label="Kind of announcement">
                      <option value="info" selected>Information</option>
                      <option value="success">Good news</option>
                      <option value="warning">Warning</option>
                    </select>
                  </div>
                  <input type="text" class="form-control" id="alert-message" placeholder="Write a short message" name="alertMessage" maxlength="255" required>
                  <div class="input-group-append"><button class="btn btn-primary" type="submit">Post</button></div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div id="rems-footer"></div>
    </div>
  </div>
  <a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
