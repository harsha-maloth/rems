<!doctype html>
<html lang="en">
<head id="head_tag">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" sizes="600x600" href="assets/img/Logo_White.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B4444">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&display=swap">
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="assets/js/dark-mode.js"></script>
  <title>Congratulations</title>
</head>
<body class="bg-gradient-primary">
  <div class="container">
    <div class="jumbotron text-center mt-5 shadow">
      <h1 class="display-5">Congratulations!</h1>
      <p class="lead"><strong>We have received your registration.</strong> You'll be reached by one of our executives shortly!</p>
      <hr>
      <p id="contact" style="display:none">Having trouble? <a id="contact-link" href="#">Contact us</a></p>
      <p class="lead mb-0">
        <a class="btn btn-primary btn-sm" href="index.html" role="button">Continue to homepage</a>
      </p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script>
    // Optional: add CONTACT_EMAIL: "club@example.com" to js/config.js to show a contact link here.
    (function () {
      var c = window.REMS_CONFIG && window.REMS_CONFIG.CONTACT_EMAIL;
      if (c && /^[^\s@<>"']+@[^\s@<>"']+$/.test(c)) {
        document.getElementById('contact-link').href = 'mailto:' + c;
        document.getElementById('contact').style.display = '';
      }
    })();
  </script>
</body>
</html>
